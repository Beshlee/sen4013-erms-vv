name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build API
        run: dotnet build src/ERMS.Api/ERMS.Api.csproj --configuration Release

      - name: Run tests with coverage
        run: >
          dotnet test tests/ERMS.Tests/ERMS.Tests.csproj
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory coverage
          --logger "trx;LogFileName=test-results.trx"

      - name: Coverage report
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.3.11
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:coverage-report \
            -reporttypes:"Html;MarkdownSummaryGithub"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage-report
            coverage/**/*.trx
